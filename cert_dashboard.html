<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineer Certification Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0070d2;--blue-dark:#005fb2;--blue-light:#e8f4fd;
  --green:#2e844a;--green-bg:#eaf5ec;
  --red:#ba0517;--red-bg:#fef0ee;
  --grey:#706e6b;--grey-light:#f4f6f9;--grey-border:#dddbda;
  --text:#3e3e3c;--white:#fff;
  --shadow:0 2px 8px rgba(0,0,0,.12);
}
body{font-family:"Salesforce Sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--grey-light);color:var(--text);font-size:14px;line-height:1.5}

/* ── Header ── */
.hdr{background:var(--blue);color:var(--white);padding:14px 24px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.hdr-icon{width:36px;height:36px;background:var(--white);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-icon svg{fill:var(--blue)}
.hdr-title{font-size:18px;font-weight:700;line-height:1.2}
.hdr-sub{font-size:12px;opacity:.85;margin-top:2px}
.hdr-ts{margin-left:auto;font-size:11px;opacity:.7;white-space:nowrap}

/* ── Layout ── */
.main{max-width:1360px;margin:0 auto;padding:22px 20px}

/* ── Stat cards ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:var(--white);border-radius:8px;padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--blue);text-align:center}
.card.g{border-top-color:var(--green)}
.card.r{border-top-color:var(--red)}
.card-n{font-size:34px;font-weight:700;color:var(--blue);line-height:1}
.card.g .card-n{color:var(--green)}
.card.r .card-n{color:var(--red)}
.card-l{font-size:11px;color:var(--grey);margin-top:5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}

/* ── Filter bar ── */
.fbar{background:var(--white);border-radius:8px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fbar label{font-size:12px;font-weight:600;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.fbar select{border:1px solid var(--grey-border);border-radius:4px;padding:7px 12px;font-size:14px;color:var(--text);min-width:230px;cursor:pointer;background:var(--white)}
.fbar select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,112,210,.2)}
.fbar-count{margin-left:auto;font-size:12px;color:var(--grey)}

/* ── Table wrapper ── */
.tbl-wrap{background:var(--white);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.tbl-head{padding:14px 18px;border-bottom:1px solid var(--grey-border);display:flex;align-items:center;justify-content:space-between}
.tbl-head h2{font-size:15px;font-weight:600}
table{width:100%;border-collapse:collapse}
thead th{background:#f8f8f8;padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--grey-border);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{background:#efefef}
thead th[data-sort].asc::after{content:" ↑"}
thead th[data-sort].desc::after{content:" ↓"}
thead th.num{text-align:center}
tbody tr{border-bottom:1px solid #f3f2f1;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#f8f8ff}
td{padding:11px 14px;vertical-align:middle}
td.num{text-align:center}
.eng-name{font-weight:600;color:var(--text)}
.eng-title{font-size:11px;color:var(--grey);margin-top:2px}
.mgr-name{color:var(--text)}

/* ── Badge buttons ── */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:28px;padding:0 10px;border-radius:14px;font-weight:700;font-size:14px;border:none;cursor:pointer;transition:transform .1s,box-shadow .1s;line-height:1}
.badge:hover{transform:scale(1.1);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.badge.blue{background:var(--blue-light);color:var(--blue)}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.zero{background:#f3f2f1;color:#bbb;cursor:default;font-size:12px}
.badge.zero:hover{transform:none;box-shadow:none}

/* ── Empty row ── */
.empty td{text-align:center;color:var(--grey);padding:32px;font-style:italic}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--white);border-radius:10px;width:100%;max-width:780px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.26);transform:translateY(24px);transition:transform .2s}
.overlay.open .modal{transform:translateY(0)}
.modal-hdr{padding:18px 22px;border-bottom:1px solid var(--grey-border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-hdr-left h3{font-size:17px;font-weight:700}
.modal-sub{font-size:12px;color:var(--grey);margin-top:3px}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--grey);padding:0 2px;line-height:1;flex-shrink:0}
.modal-close:hover{color:var(--text)}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--grey-border);border-bottom:1px solid var(--grey-border)}
.mstat{background:#fafafa;padding:14px 18px;text-align:center}
.mstat-n{font-size:26px;font-weight:700}
.mstat-l{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.modal-body{overflow-y:auto}
.ctbl{width:100%;border-collapse:collapse}
.ctbl th{background:#f8f8f8;padding:9px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--grey-border)}
.ctbl td{padding:10px 14px;border-bottom:1px solid #f3f2f1;font-size:13px}
.ctbl tr:last-child td{border-bottom:none}
.ctbl .cname{font-weight:500}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pill.current{background:var(--green-bg);color:var(--green)}
.pill.maint{background:var(--red-bg);color:var(--red)}
.pill.none{background:#f3f2f1;color:var(--grey)}

/* ── Responsive ── */
@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hdr-ts{display:none}
}
@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr}
  td,th{padding:9px 10px}
  .modal{max-height:95vh}
}
</style>
</head>

<header class="hdr">
  <div class="hdr-icon">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 6h-2.18c.07-.44.18-.88.18-1.36C18 2.06 15.96 0 13.46 0c-1.37 0-2.52.56-3.46 1.44C9.06.56 7.91 0 6.54 0 4.04 0 2 2.06 2 4.64c0 .48.11.92.18 1.36H0v14c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7.46-4c1.4 0 2.46 1.08 2.46 2.64 0 1.56-1.06 2.64-2.46 2.64H11.5A4.84 4.84 0 0111 6.5V5.3l-.01-.02C11.07 3.54 12.1 2 12.54 2zM6.54 2C7.6 2 9 3.3 9 4.64c0 1.56-1.06 2.64-2.46 2.64-1.4 0-2.54-1.1-2.54-2.64C4 3.08 5.14 2 6.54 2zM2 20V8h9v12H2zm20 0h-9V8h9v12z"/></svg>
  </div>
  <div>
    <div class="hdr-title">Engineer Certification Dashboard</div>
    <div class="hdr-sub">Manvendra Mishra's Org &middot; Hyderabad TSE Team</div>
  </div>
  <div class="hdr-ts" id="hdr-ts"></div>
</header>

<div class="main">

  <div class="stats">
    <div class="card"><div class="card-n" id="s-eng">0</div><div class="card-l">Engineers</div></div>
    <div class="card"><div class="card-n" id="s-tot">0</div><div class="card-l">Total Certifications</div></div>
    <div class="card g"><div class="card-n" id="s-cur">0</div><div class="card-l">Current</div></div>
    <div class="card r"><div class="card-n" id="s-mnt">0</div><div class="card-l">Maintenance Due</div></div>
  </div>

  <div class="fbar">
    <label for="mgr-sel">Manager</label>
    <select id="mgr-sel" onchange="applyFilter()">
      <option value="">All Managers</option>
    </select>
    <span class="fbar-count" id="fbar-count"></span>
  </div>

  <div class="tbl-wrap">
    <div class="tbl-head">
      <h2 id="tbl-title">All Engineers</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th data-sort="name" onclick="sortBy('name')">Engineer</th>
          <th data-sort="manager" onclick="sortBy('manager')">Manager</th>
          <th data-sort="total" onclick="sortBy('total')" class="num">Total Certs</th>
          <th data-sort="current" onclick="sortBy('current')" class="num">Current</th>
          <th data-sort="maintenance" onclick="sortBy('maintenance')" class="num">Maintenance Due</th>
          <th data-sort="pd1" onclick="sortBy('pd1')" class="num">PD1 Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-hdr-left">
        <h3 id="m-name"></h3>
        <div class="modal-sub" id="m-sub"></div>
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-stats">
      <div class="mstat"><div class="mstat-n" id="m-tot" style="color:var(--blue)">0</div><div class="mstat-l">Total</div></div>
      <div class="mstat"><div class="mstat-n" id="m-cur" style="color:var(--green)">0</div><div class="mstat-l">Current</div></div>
      <div class="mstat"><div class="mstat-n" id="m-mnt" style="color:var(--red)">0</div><div class="mstat-l">Maintenance Due</div></div>
    </div>
    <div class="modal-body">
      <table class="ctbl">
        <thead>
          <tr>
            <th>Certification</th>
            <th>Status</th>
            <th>Expiry Date</th>
            <th>Due Date</th>
          </tr>
        </thead>
        <tbody id="ctbody"></tbody>
      </table>
    </div>
  </div>
</div>

let filterMgr = '';
let sortKey = 'name';
let sortDir = 1;

function stats(e) {
  const c = e.certifications;
  return {
    total: c.length,
    current: c.filter(x => x.status === 'CURRENT').length,
    maintenance: c.filter(x => x.status === 'MAINTENANCEDUE').length
  };
}

function pd1Status(e) {
  const c = e.certifications.find(x => x.badge === 'Certified Platform Developer');
  return c ? c.status : null; // 'CURRENT', 'MAINTENANCEDUE', or null
}

function filtered() {
  return filterMgr ? DATA.filter(e => e.manager === filterMgr) : DATA;
}

function fmt(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function updateStats(data) {
  let tot=0, cur=0, mnt=0;
  data.forEach(e => { const s=stats(e); tot+=s.total; cur+=s.current; mnt+=s.maintenance; });
  document.getElementById('s-eng').textContent = data.length;
  document.getElementById('s-tot').textContent = tot;
  document.getElementById('s-cur').textContent = cur;
  document.getElementById('s-mnt').textContent = mnt;
  document.getElementById('fbar-count').textContent = data.length + ' engineer' + (data.length !== 1 ? 's' : '');
  document.getElementById('tbl-title').textContent = filterMgr ? filterMgr + "'s Team" : 'All Engineers';
}

function render() {
  const data = filtered();
  updateStats(data);

  const sorted = [...data].sort((a, b) => {
    const sa = stats(a), sb = stats(b);
    let va, vb;
    switch(sortKey) {
      case 'name':        va=a.name;         vb=b.name;         break;
      case 'manager':     va=a.manager;      vb=b.manager;      break;
      case 'total':       va=sa.total;       vb=sb.total;       break;
      case 'current':     va=sa.current;     vb=sb.current;     break;
      case 'maintenance': va=sa.maintenance; vb=sb.maintenance; break;
      case 'pd1': {
        const pOrder = {'CURRENT':0,'MAINTENANCEDUE':1,null:2,undefined:2};
        va = pOrder[pd1Status(a)] ?? 2;
        vb = pOrder[pd1Status(b)] ?? 2;
        break;
      }
      default:            va=a.name;         vb=b.name;
    }
    if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });

  const tbody = document.getElementById('tbody');

  if (!sorted.length) {
    tbody.innerHTML = '<tr class="empty"><td colspan="6">No engineers found for this manager.</td></tr>';
    return;
  }

  tbody.innerHTML = sorted.map(e => {
    const s = stats(e);
    const id = e.id;

    const bTotal = s.total > 0
      ? `<button class="badge blue" onclick="openModal('${id}',null)">${s.total}</button>`
      : `<span class="badge zero">—</span>`;
    const bCur = s.current > 0
      ? `<button class="badge green" onclick="openModal('${id}','CURRENT')">${s.current}</button>`
      : `<span class="badge zero">0</span>`;
    const bMnt = s.maintenance > 0
      ? `<button class="badge red" onclick="openModal('${id}','MAINTENANCEDUE')">${s.maintenance}</button>`
      : `<span class="badge zero">0</span>`;

    const pd1 = pd1Status(e);
    let bPd1;
    if (pd1 === 'CURRENT')
      bPd1 = `<button class="badge green" onclick="openModal('${id}',null)" title="Certified Platform Developer – Current">Current</button>`;
    else if (pd1 === 'MAINTENANCEDUE')
      bPd1 = `<button class="badge red"  onclick="openModal('${id}','MAINTENANCEDUE')" title="Certified Platform Developer – Maintenance Due">Maint. Due</button>`;
    else
      bPd1 = `<span class="badge zero" title="Certified Platform Developer not acquired">—</span>`;

    return `<tr>
      <td>
        <div class="eng-name">${e.name}</div>
        <div class="eng-title">${e.title || ''}</div>
      </td>
      <td class="mgr-name">${e.manager}</td>
      <td class="num">${bTotal}</td>
      <td class="num">${bCur}</td>
      <td class="num">${bMnt}</td>
      <td class="num">${bPd1}</td>
    </tr>`;
  }).join('');
}

function sortBy(key) {
  // Clear all sort indicators
  document.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.classList.remove('asc', 'desc');
  });
  if (sortKey === key) {
    sortDir *= -1;
  } else {
    sortKey = key;
    sortDir = (key === 'total' || key === 'current' || key === 'maintenance') ? -1 : 1;
  }
  const th = document.querySelector(`thead th[data-sort="${key}"]`);
  if (th) th.classList.add(sortDir === 1 ? 'asc' : 'desc');
  render();
}

function applyFilter() {
  filterMgr = document.getElementById('mgr-sel').value;
  render();
}

function openModal(engineerId, statusFilter) {
  const e = DATA.find(x => x.id === engineerId);
  if (!e) return;

  document.getElementById('m-name').textContent = e.name;
  document.getElementById('m-sub').textContent = (e.title || 'Engineer') + ' · Manager: ' + e.manager;

  const s = stats(e);
  document.getElementById('m-tot').textContent = s.total;
  document.getElementById('m-cur').textContent = s.current;
  document.getElementById('m-mnt').textContent = s.maintenance;

  // Sort order: MAINTENANCEDUE → CURRENT → null, then alpha within group
  const order = { 'MAINTENANCEDUE': 0, 'CURRENT': 1, null: 2, undefined: 2 };
  let certs = e.certifications;
  if (statusFilter) certs = certs.filter(c => c.status === statusFilter);

  const sorted = [...certs].sort((a, b) => {
    const oa = order[a.status] ?? 2;
    const ob = order[b.status] ?? 2;
    if (oa !== ob) return oa - ob;
    return a.badge.localeCompare(b.badge);
  });

  document.getElementById('ctbody').innerHTML = sorted.map(c => {
    let pillClass = 'none', pillLabel = '—';
    if (c.status === 'CURRENT')       { pillClass = 'current'; pillLabel = 'Current'; }
    if (c.status === 'MAINTENANCEDUE') { pillClass = 'maint';   pillLabel = 'Maintenance Due'; }
    return `<tr>
      <td class="cname">${c.badge}</td>
      <td><span class="pill ${pillClass}">${pillLabel}</span></td>
      <td>${fmt(c.expiry)}</td>
      <td>${fmt(c.due)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--grey);padding:20px">No certifications in this category.</td></tr>';

  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

function overlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Timestamp
document.getElementById('hdr-ts').textContent =
  'Data as of ' + new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});

// Initial render + default sort indicator
// Populate manager dropdown from DATA
(function() {
  const mgrs = [...new Set(DATA.map(e => e.manager))].filter(Boolean).sort();
  const sel = document.getElementById('mgr-sel');
  mgrs.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    sel.appendChild(o);
  });
})();

render();
document.querySelector('thead th[data-sort="name"]').classList.add('asc');
</script>
</body>
</html>
